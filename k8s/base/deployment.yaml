apiVersion: apps/v1
kind: Deployment
metadata:
  name: infernal-worker-simple
  labels:
    app.kubernetes.io/name: infernal-worker-simple
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: infernal-worker-simple
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infernal-worker-simple
    spec:
      automountServiceAccountToken: false
      serviceAccountName: infernal-worker-simple
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: infernal-worker-simple
          image: localhost/infernal-worker-simple:latest
          imagePullPolicy: IfNotPresent
          # No ports: this service only ever makes outbound signed calls
          # into the kernel: it never listens for inbound connections, so
          # it has no HTTP surface for a liveness/readiness probe to
          # check. Kubernetes' own container restart policy is what
          # recovers a crashed process.
          env:
            # In-cluster DNS name of infernal-law's own Service
            # (k8s/base/service.yaml in that repo). infernal-client-rs's
            # SignedRequest always dials https://<authority>, which
            # reaches infernal-law's tls-proxy sidecar (see that repo's
            # k8s/base/deployment.yaml), not its plain-HTTP listener
            # directly.
            - name: KERNEL_AUTHORITY
              value: "infernal-law"
            # infernal-law's tls-proxy sidecar uses a self-signed
            # certificate for local/test deployments (see this repo's
            # README), which this process must be told to trust
            # explicitly -- see KERNEL_CA_CERT_PATH below and the
            # kernel-ca-cert volume. Omit both for a kernel with an
            # ordinary publicly-trusted certificate.
            - name: KERNEL_CA_CERT_PATH
              value: /etc/infernal-law/ca/ca.crt
            # Must already be provisioned as an identities row and
            # enrolled with the kernel (ADR-0008) before any call this
            # process signs will be accepted, and before any route will
            # ever be eligible for it -- deployment configuration, not
            # something this manifest or the image itself performs.
            - name: WORKER_SERVICE_ID
              value: "00000000-0000-4000-8000-000000000003"
            # This process has no inbound listener; nothing currently
            # connects to this address (see SERVICE_ENDPOINT's own
            # documentation in src/lib.rs).
            - name: SERVICE_ENDPOINT
              value: https://infernal-worker-simple
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            # Left unset on purpose. This process now obtains its own
            # ADR-0008 challenge from the kernel
            # (POST /v1/enrollments/challenges, ADR-0015), authenticated by
            # the projected ServiceAccount token mounted below, so every
            # Pod enrolls itself -- including one that replaces a crashed
            # or rescheduled predecessor. Setting it to a real challenge
            # (base64url, 32 bytes) overrides that and is single-use, so an
            # injected value works exactly once per Deployment revision.
            # - name: ENROLLMENT_CHALLENGE
            #   value: ""
            # Seconds to sleep between claiming a route and completing it;
            # zero (the default) means instant, since the placeholder
            # "execute" step has no real work to do. Set this to create a
            # real window for deliberately killing this process mid-claim,
            # for example to exercise reclaim/fencing against a genuine
            # lease expiry.
            # - name: WORK_DURATION_SECONDS
            #   value: "0"
          volumeMounts:
            - name: kernel-ca-cert
              mountPath: /etc/infernal-law/ca
              readOnly: true
            - name: enrollment-token
              mountPath: /var/run/secrets/infernal-law-enrollment
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      volumes:
        # Not committed: create with, for example,
        #   kubectl create configmap infernal-law-ca-cert \
        #     --from-file=ca.crt=infernal-law-tls.crt
        # using the same self-signed certificate infernal-law's tls-proxy
        # sidecar serves (see this repo's README's Kubernetes section).
        # A certificate is public information, so a ConfigMap (not a
        # Secret) is the right primitive here.
        - name: kernel-ca-cert
          configMap:
            name: infernal-law-ca-cert
        # A short-lived, auto-rotated token scoped to exactly the
        # infernal-law-enrollment audience -- distinct from the
        # ServiceAccount's own identity, which this process never mounts
        # (automountServiceAccountToken: false) since it has no other use
        # for it.
        - name: enrollment-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: infernal-law-enrollment
                  expirationSeconds: 600
      terminationGracePeriodSeconds: 10
